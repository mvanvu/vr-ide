[workspace]
resolver = "3"
members = ["crates/vr-core", "crates/vr-config", "crates/vr-fs", "crates/vr-search", "crates/vr-syntax", "crates/vr-ide", "crates/vr-term", "crates/vr-git", "crates/vr-window"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
ropey = { version = "=1.6.1", default-features = false, features = ["simd", "cr_lines"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
arboard = "3.7.0"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
trash = "5.4.0"
ignore = "0.4.35"
grep-searcher = "0.1.18"
grep-regex = "0.1.15"
grep-matcher = "0.1.10"
nucleo-matcher = "0.3.1"
rustix = { version = "1.1.6", features = ["fs"] }
regex = "1.13.2"
toml = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.105"
tracing = "0.1.44"
directories = "6.0.0"
insta = "1.49.0"
tempfile = "3.27.0"
similar = "3.2.1"
serde_json = "1.0.154"

# AI login window (vr-ide feature `login-window`): URL parsing for its allow-list, the window
# and the web view (WebKitGTK 4.1 on Linux).
url = "=2.5.8"
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"] }
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06", "x11"] }

# Syntax highlighting (M4). One tree-sitter version; every grammar is ABI 13..=15 compatible with it.
tree-sitter = "=0.27.2"
tree-sitter-highlight = "=0.27.2"
tree-sitter-language = "=0.1.9"
cc = "=1.11.3"
tree-sitter-php = "=0.25.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-scss = "=1.0.0"
tree-sitter-dart = "=0.3.0"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md = "=0.5.4"
tree-sitter-xml = "=0.7.0"

vr-core = { path = "crates/vr-core" }
vr-config = { path = "crates/vr-config" }
vr-fs = { path = "crates/vr-fs" }
vr-search = { path = "crates/vr-search" }
vr-syntax = { path = "crates/vr-syntax" }
vr-term = { path = "crates/vr-term" }
vr-git = { path = "crates/vr-git" }
vr-window = { path = "crates/vr-window" }

# Integrated terminal (M5): PTY (MIT) and emulator (Apache-2.0), wrapped by vr-term's own types.
portable-pty = "=0.9.0"
alacritty_terminal = { version = "=0.26.0", default-features = false }

# Window renderer (vr-window): shaping, font fallback and glyph rasterising (swash).
cosmic-text = "=0.19.0"
sys-locale = "=0.3.2"
fontconfig-parser = "=0.5.8"
# Window input types (vr-window): key, mouse and IME events. Default features spelled out; none
# pulls GTK (the Wayland title bar is sctk-adwaita, drawn in Rust).
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
# Window surface (vr-window): presents the CPU-drawn canvas. No kms (DRM) backend: a window needs
# X11 or Wayland. Pure Rust protocol crates, libxcb / libwayland loaded at run time.
softbuffer = { version = "=0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# The X11 IO error handler (vr-window): recovery before libX11 ends the process on a lost
# server. Already in the lock through winit; loaded at run time like winit's.
x11-dl = "=2.21.0"
# SIGTERM in the window (vr-ide feature `window`): a flag the loop turns into the quit path.
signal-hook = { version = "=0.3.18", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The terminal emulator parses every byte a program prints; unoptimised it manages ~2 MB/s and
# holds its lock for milliseconds, so debug builds and tests optimise it, its parser and vr-term
# (where the emulator's generic code is instantiated).
[profile.dev.package.vr-term]
opt-level = 3

[profile.dev.package.alacritty_terminal]
opt-level = 3

[profile.dev.package.vte]
opt-level = 3
