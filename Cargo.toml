[workspace]
resolver = "3"
members = ["crates/vr-core", "crates/vr-config", "crates/vr-fs", "crates/vr-search", "crates/vr-ide"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
ropey = "=1.6.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
arboard = "3.7.0"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
trash = "5.4.0"
ignore = "0.4.35"
grep-searcher = "0.1.18"
grep-regex = "0.1.15"
grep-matcher = "0.1.10"
nucleo-matcher = "0.3.1"
regex = "1.13.2"
toml = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.105"
tracing = "0.1.44"
directories = "6.0.0"
insta = "1.49.0"
tempfile = "3.27.0"
similar = "3.2.1"

vr-core = { path = "crates/vr-core" }
vr-config = { path = "crates/vr-config" }
vr-fs = { path = "crates/vr-fs" }
vr-search = { path = "crates/vr-search" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
