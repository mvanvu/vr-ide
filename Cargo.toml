[workspace]
resolver = "3"
members = ["crates/vr-core", "crates/vr-config", "crates/vr-fs", "crates/vr-search", "crates/vr-syntax", "crates/vr-ide"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
ropey = { version = "=1.6.1", default-features = false, features = ["simd", "cr_lines"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
arboard = "3.7.0"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
trash = "5.4.0"
ignore = "0.4.35"
grep-searcher = "0.1.18"
grep-regex = "0.1.15"
grep-matcher = "0.1.10"
nucleo-matcher = "0.3.1"
rustix = { version = "1.1.6", features = ["fs"] }
regex = "1.13.2"
toml = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.105"
tracing = "0.1.44"
directories = "6.0.0"
insta = "1.49.0"
tempfile = "3.27.0"
similar = "3.2.1"

# Syntax highlighting (M4). One tree-sitter version; every grammar is ABI 13..=15 compatible with it.
tree-sitter = "=0.27.2"
tree-sitter-highlight = "=0.27.2"
tree-sitter-language = "=0.1.9"
cc = "=1.11.3"
tree-sitter-php = "=0.25.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-scss = "=1.0.0"
tree-sitter-dart = "=0.3.0"
tree-sitter-go = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md = "=0.5.4"

vr-core = { path = "crates/vr-core" }
vr-config = { path = "crates/vr-config" }
vr-fs = { path = "crates/vr-fs" }
vr-search = { path = "crates/vr-search" }
vr-syntax = { path = "crates/vr-syntax" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
