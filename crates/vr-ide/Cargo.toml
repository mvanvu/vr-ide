[package]
name = "vr-ide"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["login-window", "window"]
# The AI login window (`ai::login`): an embedded web view; Linux needs libwebkit2gtk-4.1.
login-window = ["dep:wry", "dep:tao"]
# The native window (vr-window: winit + softbuffer, no GTK); without it, or without a display, or
# with `--tui`, vr-ide runs in the terminal.
window = ["dep:vr-window", "dep:signal-hook"]

[dependencies]
vr-core.workspace = true
vr-config.workspace = true
vr-fs.workspace = true
vr-search.workspace = true
vr-syntax.workspace = true
vr-term.workspace = true
vr-git.workspace = true
rustix = { workspace = true, features = ["event", "process", "rand"] }
ratatui.workspace = true
crossterm.workspace = true
arboard.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
ignore.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
url.workspace = true
wry = { workspace = true, optional = true }
tao = { workspace = true, optional = true }
vr-window = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true, optional = true }

[dev-dependencies]
vr-core = { workspace = true, features = ["test-util"] }
insta.workspace = true
tempfile.workspace = true
