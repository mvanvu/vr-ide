# vr-ide built-in keymap: its own key set (USER-5, D250), one key per command.
#
# Override any key in ~/.config/vr-ide/keymap.toml; only the keys you list change.
#
# Format
#   "ctrl+s" = "file.save"            # global: works wherever the focused panel does not bind the key
#   ctrl+s = "file.save"              # same; quotes around the key are optional
#   "ctrl+q" = ""                     # empty command name removes a built-in binding
#   [explorer]                        # context tables:
#   "delete" = "explorer.delete"      #   editor | explorer | palette | terminal
#   "delete" = { command = "explorer.delete", when = "explorer" }   # same, as one line at top level
#
# Lookup: the focused context's table first, then the global keys. The terminal context is the
# exception (D8): a focused terminal gets every key except the ones in [terminal].
#
# Keys: one key with modifiers ctrl, shift, alt (any order, case-insensitive) joined by "+":
#   a letter, digit or symbol ("ctrl+/", "ctrl+]", "ctrl+`"), f1..f24, enter, escape, tab,
#   backspace, delete, insert, home, end, pageup, pagedown, up, down, left, right, space, plus.
# A binding is always one key; there are no key sequences.
# Cursor movement and typing (arrows, home/end, pageup/pagedown, shift+ to extend, ctrl+left/right,
# backspace/delete/enter/tab in the editor) are built in and not listed here.
# Unknown command names are reported in a startup notice; the rest of the file still applies.
#
# Every default key reaches vr-ide from a terminal without the kitty protocol and none is taken by
# GNOME Terminal or the GNOME desktop: ctrl+letter or an F key (alone, with ctrl or with shift);
# no alt, no ctrl+shift+letter, no ctrl+PageUp/PageDown, no F10/F11 (USER-5).
# Commands without a key run from the command palette (F1): file.save_overwrite, explorer.toggle,
# explorer.move and the workspace commands.

# ---- global ----------------------------------------------------------------
"f1" = "app.palette"
"ctrl+q" = "app.quit"
"ctrl+p" = "file.goto"
"ctrl+o" = "file.open"
"ctrl+s" = "file.save"
"f12" = "file.save_as"
"f5" = "file.reload"
"ctrl+w" = "file.close"
# There are no untitled buffers: this creates the file on disk.
"ctrl+n" = "explorer.new_file"
"f9" = "tab.next"
"shift+f9" = "tab.prev"
"f6" = "focus.cycle"
# Hidden explorer: show it and focus it; shown: hide it and the editor gets the keys.
"ctrl+e" = "explorer.toggle_focus"
"ctrl+b" = "explorer.focus"
"ctrl+k" = "explorer.reveal"
"ctrl+f5" = "explorer.toggle_hidden"
"ctrl+f6" = "explorer.toggle_ignored"
"ctrl+t" = "search.project"
"ctrl+r" = "search.replace_project"
"f4" = "search.next_result"
"shift+f4" = "search.prev_result"
# Find options: act on the open find bar (or, without one, the open project search panel).
"ctrl+f1" = "find.toggle_case"
"ctrl+f2" = "find.toggle_word"
"ctrl+f3" = "find.toggle_regex"
# Integrated terminal (M5). Hidden: show and focus it (a terminal starts if there is none);
# shown elsewhere: focus it; focused: the editor gets the keys and the panel stays shown.
# Terminals without the kitty protocol send ctrl+` as NUL (the same byte as ctrl+space); that
# byte toggles too (in a focused terminal as well, unless the setting terminal_pass_nul = true).
"ctrl+`" = "terminal.toggle"
"ctrl+f12" = "terminal.new"
"shift+f12" = "terminal.hide"
"ctrl+f4" = "terminal.close"
"f8" = "terminal.next"
"shift+f8" = "terminal.prev"
"ctrl+f8" = "terminal.grow"
"ctrl+f9" = "terminal.shrink"
# ctrl+f7 is kept free for the terminal panel position command (T19).

[editor]
# Read mode / edit mode (D145, the user's keys, D249): a file is opened in read mode; ctrl+i
# edits, escape goes back to reading. Without the kitty protocol ctrl+i arrives as tab, which also
# enters edit mode from read mode (and indents in edit mode).
"ctrl+i" = "editor.edit_mode"
"escape" = "editor.read_mode"
"ctrl+z" = "edit.undo"
"ctrl+y" = "edit.redo"
"ctrl+c" = "edit.copy"
"ctrl+x" = "edit.cut"
"ctrl+v" = "edit.paste"
"ctrl+a" = "edit.select_all"
"ctrl+d" = "edit.delete_line"
"ctrl+l" = "edit.duplicate_line"
"ctrl+up" = "edit.move_line_up"
"ctrl+down" = "edit.move_line_down"
"ctrl+/" = "edit.toggle_comment"
"ctrl+]" = "edit.indent"
# ctrl+[ is Escape for most terminals, so outdent is shift+tab.
"shift+tab" = "edit.outdent"
"ctrl+g" = "nav.goto_line"
"ctrl+f" = "find.open"
"f3" = "find.next"
"shift+f3" = "find.prev"
"ctrl+u" = "find.replace_open"
"f7" = "find.replace_one"
"shift+f7" = "find.replace_all"

[explorer]
"f2" = "explorer.rename"
"ctrl+f2" = "explorer.new_folder"
"delete" = "explorer.delete"
"ctrl+c" = "explorer.copy"
"ctrl+x" = "explorer.cut"
"ctrl+v" = "explorer.paste"

[palette]
# Up/down/enter/escape in the palette are built in.

[terminal]
# D8: a focused terminal receives every key except these (global keys do not apply here).
# ctrl+` is the one reserved key: it gives the keys back to the editor and leaves the panel shown
# (shift+f12 from the editor hides it). When the panel covers the whole editor (a short window),
# ctrl+` hides the panel instead. Without the kitty protocol ctrl+` arrives as NUL and does the
# same, unless terminal_pass_nul = true sends it to the program (then click the editor to leave);
# a "ctrl+space" key added here wins over that. Built in, not listed: shift+pageup / shift+pagedown
# scroll back, ctrl+shift+v pastes.
"ctrl+`" = "terminal.toggle"
