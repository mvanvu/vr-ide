# vr-ide built-in keymap: its own key set (USER-5, keyset v2 D261), one key per command.
#
# Override any key in ~/.config/vr-ide/keymap.toml; only the keys you list change.
#
# Format
#   "ctrl+s" = "file.save"            # global: works wherever the focused panel does not bind the key
#   ctrl+s = "file.save"              # same; quotes around the key are optional
#   "ctrl+q" = ""                     # empty command name removes a built-in binding
#   [explorer]                        # context tables:
#   "delete" = "explorer.delete"      #   editor | explorer | palette | terminal
#   "delete" = { command = "explorer.delete", when = "explorer" }   # same, as one line at top level
#
# Lookup: the focused context's table first, then the global keys. The terminal context is the
# exception (D8): a focused terminal gets every key except the ones in [terminal].
#
# Keys: one key with modifiers ctrl, shift, alt (any order, case-insensitive) joined by "+":
#   a letter, digit or symbol ("ctrl+/", "ctrl+]", "ctrl+`"), f1..f24, enter, escape, tab,
#   backspace, delete, insert, home, end, pageup, pagedown, up, down, left, right, space, plus.
# A binding is always one key; there are no key sequences.
#
# Built in, not listed here:
#   - cursor movement and typing (arrows, home/end, pageup/pagedown, shift+ to extend,
#     ctrl+left/right, backspace/delete/enter in the editor);
#   - read (normal) mode in the editor: space then i enters edit mode, space then space opens
#     the command palette (like f1), space then another key only shows a hint; tab moves the
#     focus to the next part (editor, explorer, terminal; ctrl+f reaches the find box);
#   - edit mode: tab indents (shift+tab outdents, below), escape goes back to read mode.
# Unknown command names are reported in a startup notice; the rest of the file still applies.
#
# Every default key reaches vr-ide from a terminal without the kitty protocol and none is taken by
# GNOME Terminal or the GNOME desktop: ctrl+letter or an F key (alone, with ctrl or with shift);
# no alt, no ctrl+shift+letter, no ctrl+PageUp/PageDown, no F10/F11 (USER-5). The user approved
# one exception: ctrl+h (byte 0x08; GNOME Terminal's Backspace sends 0x7f, so they differ).
# Commands without a key run from the command palette (f1): project search (also ctrl+f twice)
# and its result stepping, replace one / all, new folder, save as, reload from disk, indent,
# focus cycle, and others.

# ---- global ----------------------------------------------------------------
"f1" = "app.palette"
"ctrl+q" = "app.quit"
"ctrl+p" = "file.goto"
"ctrl+o" = "file.open"
"ctrl+s" = "file.save"
"ctrl+w" = "file.close"
# There are no untitled buffers: this creates the file on disk. In the explorer ctrl+n asks
# File / Folder first (see [explorer]).
"ctrl+n" = "explorer.new_file"
"f9" = "tab.next"
"shift+f9" = "tab.prev"
# Hidden explorer: show it and focus it; shown: hide it and the editor gets the keys.
"ctrl+e" = "explorer.toggle_focus"
"ctrl+b" = "explorer.focus"
"ctrl+k" = "explorer.reveal"
"ctrl+h" = "explorer.toggle_hidden"
"ctrl+f6" = "explorer.toggle_ignored"
# Replace is contextual: in the editor (and the find box on the file) it opens the in-file
# replace, see [editor]; in the find box on the project (and elsewhere) the project replace.
"ctrl+r" = "search.replace_project"
# Integrated terminal (M5). Hidden: show and focus it (a terminal starts if there is none);
# shown: hide it, whatever has the keys (D280). The "+" and "x" of the panel's tab bar open and
# close terminals (no keys, D291).
# Terminals without the kitty protocol send ctrl+` as NUL (the same byte as ctrl+space); that
# byte toggles too (in a focused terminal as well, unless the setting terminal_pass_nul = true).
"ctrl+`" = "terminal.toggle"
"shift+f12" = "terminal.hide"
"f8" = "terminal.next"
"shift+f8" = "terminal.prev"
# grow / shrink change the panel's height at the bottom, its width on the right.
"ctrl+f8" = "terminal.grow"
"ctrl+f9" = "terminal.shrink"
# Terminal panel at the bottom / on the right, for the session (setting terminal_position).
"ctrl+f7" = "terminal.toggle_position"

[editor]
# Read mode / edit mode (D145): a file opens in read mode; space i edits (built in), escape
# goes back to reading. Edit keys in read mode show the hint "Read mode: space i to edit".
"escape" = "editor.read_mode"
"ctrl+z" = "edit.undo"
"ctrl+y" = "edit.redo"
"ctrl+c" = "edit.copy"
"ctrl+x" = "edit.cut"
"ctrl+v" = "edit.paste"
"ctrl+a" = "edit.select_all"
"ctrl+d" = "edit.delete_line"
"ctrl+l" = "edit.duplicate_line"
"ctrl+up" = "edit.move_line_up"
"ctrl+down" = "edit.move_line_down"
"ctrl+/" = "edit.toggle_comment"
# ctrl+[ is Escape for most terminals, so outdent is shift+tab (tab indents, built in).
"shift+tab" = "edit.outdent"
"ctrl+g" = "nav.goto_line"
# One find box for the file and the project, with a result list; ctrl+f in the box switches
# the scope. Query syntax: /re/ regex, a trailing /i ignores case, \/ is a slash.
"ctrl+f" = "find.open"
# f4 / shift+f4: without the kitty protocol shift+f3 never reaches vr-ide (D279).
"f4" = "find.next"
"shift+f4" = "find.prev"
# The replace row of the find box in its scope; in the file it switches to edit mode: Enter in
# the replace field asks Replace: One / All / Cancel.
"ctrl+r" = "find.replace_open"

[explorer]
"f2" = "explorer.rename"
# Asks File / Folder (File first), then the name.
"ctrl+n" = "explorer.new"
"delete" = "explorer.delete"
"ctrl+c" = "explorer.copy"
"ctrl+x" = "explorer.cut"
"ctrl+v" = "explorer.paste"

[palette]
# Up/down/enter/escape in the palette are built in.

[terminal]
# D8: a focused terminal receives every key except these (global keys do not apply here).
# ctrl+` hides the panel and the editor gets the keys. Without the kitty protocol ctrl+` arrives
# as NUL and does the same, unless terminal_pass_nul = true sends it to the program (then click
# the editor to leave); a "ctrl+space" key added here wins over that. f1 opens the command window
# from a focused terminal too (D279). Built in, not listed: shift+pageup / shift+pagedown scroll
# back, ctrl+shift+v pastes.
"ctrl+`" = "terminal.toggle"
"f1" = "app.palette"
# The panel position and size keys work from a focused terminal too (they never reach the
# program); f8 / shift+f8 still go to it.
"ctrl+f7" = "terminal.toggle_position"
"ctrl+f8" = "terminal.grow"
"ctrl+f9" = "terminal.shrink"
