# vr-ide built-in settings. Copy any line to ~/.config/vr-ide/settings.toml to change it;
# keys you leave out keep these values.

# Columns per tab stop, 1..=16.
tab_width = 4
# Tab key inserts spaces instead of a tab character.
insert_spaces = true
# "synthwave" (own colours and background), "dracula" (own colours), or "dark" / "light" (the terminal's colours; the terminal panel is black with green text in every theme).
theme = "synthwave"
# Explorer shows dotfiles (.env, .github, ...), like VS Code.
show_hidden = true
# Explorer shows paths matched by .gitignore (toggle: explorer.toggle_ignored).
show_ignored = false
# Syntax highlighting is switched off for files larger than this (10 MiB).
max_highlight_bytes = 10485760
# Terminal scrollback lines (M5).
scrollback = 10000
# Terminal panel height in percent of the screen, 10..=90 (at least 5 rows); terminal.grow /
# terminal.shrink and dragging the panel's tab bar change it for the session.
terminal_height_percent = 40
# Where the terminal panel sits: "bottom" or "right" (the editor's full height, beside it).
# On the right it falls back to the bottom while the editor column is under 60 columns wide.
# terminal.toggle_position (ctrl+f7, /term right, /term bottom) changes it for the session.
terminal_position = "bottom"
# Panel width on the right in percent of the editor column, 10..=90 (at least 20 columns);
# terminal.grow / terminal.shrink and dragging the separator change it for the session.
terminal_width_percent = 40
# Terminals without the kitty keyboard protocol send ctrl+` as NUL, the same byte as ctrl+space.
# false: NUL in a focused terminal does what ctrl+` does there: the editor gets the keys back and
# the panel stays shown (terminal.hide hides it). true: NUL goes to the program (ctrl+space /
# ctrl+@ in shells and editors); a click on the editor then leaves the terminal. With the kitty
# protocol ctrl+` and ctrl+space always differ.
terminal_pass_nul = false
# SSH sessions (the ssh entry of the command window, /ssh): true gives a session the whole window
# once the login succeeded. vr-ide detects the login by starting ssh with
# "-o PermitLocalCommand=yes -o LocalCommand=<prints a one-time marker>"; it does so only when your
# ssh config sets no LocalCommand of its own. false: ssh is started without these two options and
# every session stays a tab of the terminal panel.
ssh_fullscreen = true
# Git (M7): a dim "author, 3 days ago • subject" after the cursor line once the cursor rests
# (uncommitted lines: "You, uncommitted").
git_inline_blame = false

# AI panel width in percent of the screen right of the explorer, 10..=90 (at least 30 columns;
# the editor keeps 30). ctrl+f8 / ctrl+f9 in the focused panel and dragging its separator change
# it for the session.
ai_width_percent = 40

# AI agent CLIs of the AI panel (f12, ctrl+f12, /ai <tool>); only the ones found on PATH are
# offered. A user file that sets ai_tools replaces this whole list.
#   command        a bare name looked up in the absolute PATH entries, or an absolute path;
#                  started directly with its arguments, never through a shell
#   args           passed on every start
#   continue_args  added for "Continue last" (and when a restored or exited session starts again)
#   resume_args    added for "Choose earlier": the tool shows its own list of conversations
# A tool without continue_args and resume_args offers only "New". vr-ide never reads the
# tools' own history files.
[[ai_tools]]
name = "claude"
command = "claude"
args = []
continue_args = ["--continue"]
resume_args = ["--resume"]

[[ai_tools]]
name = "codex"
command = "codex"
args = []
continue_args = ["resume", "--last"]
resume_args = ["resume"]

[[ai_tools]]
name = "gemini"
command = "gemini"
args = []

[[ai_tools]]
name = "aider"
command = "aider"
args = []

[[ai_tools]]
name = "cursor-agent"
command = "cursor-agent"
args = []
