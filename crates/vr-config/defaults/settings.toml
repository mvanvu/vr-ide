# vr-ide built-in settings. Copy any line to ~/.config/vr-ide/settings.toml to change it;
# keys you leave out keep these values.

# Columns per tab stop, 1..=16.
tab_width = 4
# Tab key inserts spaces instead of a tab character.
insert_spaces = true
# "synthwave" (own colours and background), "dracula" (own colours), or "dark" / "light" (the terminal's colours).
theme = "synthwave"
# Explorer shows dotfiles (.env, .github, ...), like VS Code.
show_hidden = true
# Explorer shows paths matched by .gitignore (toggle: explorer.toggle_ignored).
show_ignored = false
# Syntax highlighting is switched off for files larger than this (10 MiB).
max_highlight_bytes = 10485760
# Terminal scrollback lines (M5).
scrollback = 10000
# Terminal panel height in percent of the screen, 10..=90 (at least 5 rows); terminal.grow /
# terminal.shrink and dragging the panel's tab bar change it for the session.
terminal_height_percent = 40
# Terminals without the kitty keyboard protocol send ctrl+` as NUL, the same byte as ctrl+space.
# false: NUL in a focused terminal does what ctrl+` does there: the editor gets the keys back and
# the panel stays shown (terminal.hide hides it). true: NUL goes to the program (ctrl+space /
# ctrl+@ in shells and editors); a click on the editor then leaves the terminal. With the kitty
# protocol ctrl+` and ctrl+space always differ.
terminal_pass_nul = false

# AI agent CLIs opened in a terminal tab in the project root (M6).
# A user file that sets ai_presets replaces this whole list.
[[ai_presets]]
name = "claude"
command = "claude"
args = []

[[ai_presets]]
name = "cursor-agent"
command = "cursor-agent"
args = []
